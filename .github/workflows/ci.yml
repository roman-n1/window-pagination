name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  null-safety:
    name: null-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the syntax policy and scan every Kotlin source
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/check_null_safety.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Test the compiler policy and check all JVM and Android declarations
        run: ./gradlew :null-safety:test checkNullTypesJvmAndAndroid -PcheckNullTypes --stacktrace
      - name: Prove inferred nullable platform declarations are rejected
        run: python3 scripts/check_platform_null_types.py jvm android js wasm

  jvm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: xvfb-run -a ./gradlew :core:jvmTest :compose:jvmTest --stacktrace

  web-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: ./gradlew checkNullTypesWeb :core:jsNodeTest :core:wasmJsNodeTest :core:compileAndroidMain :compose:compileAndroidMain -PcheckNullTypes --stacktrace

  native-compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkNullTypesNative -PcheckNullTypes --stacktrace
      - name: Prove inferred nullable Native declarations are rejected
        run: python3 scripts/check_platform_null_types.py ios
